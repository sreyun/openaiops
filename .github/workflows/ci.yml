name: CI · Go tests

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - "cmd/server/**"
      - "cmd/agent/**"
      - "shared/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate agent embed assets
        run: go generate ./cmd/agent

      - name: OpenAPI contract gate
        run: go run ./cmd/server/genapi --check

      - name: Go test (server)
        run: go test ./cmd/server/ -count=1 -timeout 15m

      - name: AI eval golden set
        run: go test ./cmd/server/ -count=1 -run 'TestEvalCasesLoad|TestEvalRunSetOffline|TestPersistAndLatestEvalRun|TestLatestEvalRunEmpty' -timeout 3m

      - name: Agent update / unit heal gate
        run: |
          go test ./cmd/agent/ -count=1 -timeout 10m \
            -run 'AgentUpdate|UnitHeal|ResolveAgentConfig|LegacyUnix|CanonicalUnit'
          go test ./cmd/server/ -count=1 -timeout 5m \
            -run 'Legacy.*AgentUpdate|AgentUpdate|PlaybookPack|CanonicalUnit'

      - name: AI golden subset (explicit)
        run: go test ./cmd/server/ -count=1 -run 'TestAssistTaskPolicy_Golden|TestAIStatsHub|TestAIGolden' -timeout 2m
