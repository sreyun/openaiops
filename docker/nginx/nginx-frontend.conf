# ============================================================
# AIOps · Vue 前端 Nginx（开发 / 分离部署）
# - 静态：/v2/  （Vite base=/v2/）
# - API/WS/安装包：反代到 compose 服务 aiops-server:8529
# - / → 302 /v2/
# - /classic/ → 经典控制台（同域 Cookie，静态资源走根路径反代）
# ============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

upstream aiops_backend {
    server aiops-server:8529;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # 根路径进入新控制台
    location = / {
        return 302 /v2/;
    }

    # /v2 无斜杠重定向到 /v2/
    location = /v2 {
        return 302 /v2/;
    }

    # ---- 经典控制台入口（HTML）；资源仍用绝对路径 /app.js 等 ----
    location = /classic {
        return 302 /classic/;
    }
    location = /classic/ {
        proxy_pass http://aiops_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # ---- Vue SPA（构建产物在 /usr/share/nginx/html/v2）----
    location /v2/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /v2/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        # add_header X-Frame-Options "DENY" always;  # dev: disabled for iframe embedding
        add_header Referrer-Policy "no-referrer" always;
        # connect-src 'self' already covers same-origin ws:/wss: in current browsers.
        # Listing bare `ws: wss:` would let the page open a socket to ANY host.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors *" always;
    }

    # hashed assets：长缓存
    location /v2/assets/ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        access_log off;
    }

    location = /v2/sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /v2/healthz.txt {
        root /usr/share/nginx/html;
        access_log off;
        default_type text/plain;
    }

    # ---- API（含桌面/终端等可能升级为 WS 的路径）----
    location /api/ {
        proxy_pass http://aiops_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # $http_host 保留浏览器端口（如 8080）；$host 会剥端口导致 CSRF Origin 校验失败
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # ---- 实时推送 WS ----
    location /ws/ {
        proxy_pass http://aiops_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location = /healthz {
        proxy_pass http://aiops_backend;
        access_log off;
    }

    location ~* ^/(install|uninstall)(-relay)?\.(sh|ps1)$ {
        proxy_pass http://aiops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dl/ {
        proxy_pass http://aiops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # 经典 UI 静态资源 + 其余未匹配路径回源到 Go 内嵌 web/
    location / {
        proxy_pass http://aiops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
