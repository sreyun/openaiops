# ============================================================
# AIOps · Nginx 反向代理示例
# ------------------------------------------------------------
# 普通监控(指标上报/面板)只需常规反代即可；但【远程终端】用到
# WebSocket 升级 + 长连接实时流，nginx 默认不转发 Upgrade 头、且会缓冲，
# 所以必须加下面标注的几行，否则会出现「指标正常、终端连不上」。
# 这是所有 WebSocket 应用(Grafana/Jupyter/code-server 等)在 nginx 后
# 的标准要求，配置一次即可。
# ============================================================

# WebSocket 升级映射：放在 http {} 层，全局只需一次
# （若已在 nginx.conf 的 http{} 里定义过 $connection_upgrade，勿重复）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2  on;
    server_name  monitor.example.com;          # ← 改成你的域名

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;   # ← 你的证书
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # 上传/终端粘贴/端口转发文件传输等——与服务端 maxBodyBytes(100MB) 对齐，
    # 否则经代理的大文件（端口转发 HTTP 隧道）会被 nginx 提前 413 截断。
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8529;      # ← AIOps 服务端监听地址

        # ---- 常规反代头（让服务端识别真实域名/协议，安装命令自动用域名）----
        proxy_http_version 1.1;
        # $http_host 而不是 $host：前者是浏览器地址栏里的原样 Host（**带端口**），
        # 后者会把端口丢掉。端口丢了有两处后果：生成的安装命令指向默认 443/80，
        # 以及写操作的来源校验（Origin vs Host）两边对不上。
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 若上面的 Host 因故必须写成 $host（或某些网关不允许改 Host），这一行是兜底：
        # 面板会用它认出"浏览器眼中的自己"，否则改分组/改配置这类写操作会被 403。
        proxy_set_header X-Forwarded-Host  $http_host;
        # 面板开在非标准端口（如 https://a.bc.com:8443）时这一行不能少：
        # $host 不含端口，服务端只能看到 a.bc.com，生成的安装命令与脚本里的
        # SERVER= 就会指向默认 443/80 —— 面板一切正常，Agent 却怎么都注册不上。
        proxy_set_header X-Forwarded-Port  $server_port;
        # 注：服务端默认忽略上面两个 IP 头以防伪造；确认在可信反代后，
        #     请在 server_config.json 设 "trust_proxy": true，才会据此记录
        #     真实客户端 IP 并做登录限流（否则日志/限流基于 127.0.0.1）。

        # ==== 远程终端 / 远程桌面 / Agent 自动升级 必需（缺一不可）========
        # 1) 转发 WebSocket 升级（浏览器 ⇄ 服务端）——不加则终端「无法连接」
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 2) 关闭缓冲：Agent 反向通道是实时流。服务端已对下行流发
        #    `X-Accel-Buffering: no`，这里对上行(Agent→服务端)再兜底。
        #    proxy_request_buffering 尤其不能少：Agent 的上行是一个「请求体持续
        #    不结束」的 POST，nginx 默认会把请求体**收全了再转发上游**，于是服务端
        #    在命令跑完前收不到它 —— 表现为终端连不上、**Agent 自动升级永远失败**
        #    （日志里是一句误导人的「Agent 未接单」）。
        proxy_buffering         off;
        proxy_request_buffering off;

        # 3) 拉长超时：终端会话/长轮询是长连接，默认 60s 会被切断
        #    v5.4.0: 提升到 86400s(24h) 匹配 Agent 会话超时上限
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        # ================================================================
    }
}

# 可选：80 → 443 跳转
server {
    listen 80;
    server_name monitor.example.com;           # ← 同上
    return 301 https://$host$request_uri;
}
